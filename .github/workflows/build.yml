name: Build Chill Zone InvView Autocomplete
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Print build environment
        run: |
          java -version
          gradle --version
          ls -la
      - name: Build with full diagnostic logging
        shell: bash
        run: |
          set -o pipefail
          gradle clean build --stacktrace --info --no-daemon 2>&1 | tee gradle-build.log
      - name: Upload build log even if failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invview-gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn
      - name: Upload compiled addon
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chillzone-invview-autocomplete-26.3
          path: build/libs/*.jar

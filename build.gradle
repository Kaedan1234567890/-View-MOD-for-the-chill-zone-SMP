plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.3'
}
version = '0.2.8+26.3'
group = 'com.chillzone'
base { archivesName = 'chillzone-invview-autocomplete' }
repositories { maven { url = 'https://maven.fabricmc.net/' }; mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.163.0+26.3'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
jar { from('LICENSE-INVVIEW') { into 'licenses/chillzone-invview' } }

plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.1'
}
version = '0.2.0+26.3'
group = 'com.chillzone'
base { archivesName = 'chillzone-invview' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.160.5+26.3'
    modImplementation files('libs/original-invview.jar')
    include files('libs/original-invview.jar')
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
jar { from('LICENSE-INVVIEW') { into 'licenses/chillzone-invview' } }
